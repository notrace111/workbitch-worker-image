name: Build Work Bitch GPU Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - pod-start.sh
      - verify-runtime.py
      - .dockerignore
      - .github/workflows/publish-image.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Reclaim runner disk for CUDA image
        shell: bash
        run: |
          set -Eeuo pipefail

          echo '=== DISK BEFORE CLEANUP ==='
          df -h /

          echo
          echo '=== REMOVE UNUSED HOSTED-RUNNER TOOLCHAINS ==='

          for path in \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          do
            if [ -e "$path" ]; then
              echo "Removing $path"
              sudo rm -rf "$path"
            else
              echo "Absent: $path"
            fi
          done

          sudo apt-get clean
          docker system prune -af || true

          echo
          echo '=== DISK AFTER CLEANUP ==='
          df -h /

      - name: Login to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish worker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runtime-v2
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Record immutable digest
        run: |
          echo "## Work Bitch Worker Image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
